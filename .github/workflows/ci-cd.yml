name: CI/CD Pipeline

# Déclenche le workflow à chaque push ou pull request sur la branche main
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # 1. Premier job : Installation, barrière de qualité et tests
  test:
    runs-on: ubuntu-latest
    steps:
      # Étape 1 : Récupérer le code source du dépôt
      - name: Checkout repository
        uses: actions/checkout@v4

      # Étape 2 : Configurer la version de Python (alignée sur ton environnement local)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # Étape 3 : Installer les dépendances du projet
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Étape 4 : Lancer les tests et la barrière de qualité
      - name: Run tests & quality gate
        run: |
          PYTHONPATH=. pytest

  # 2. Second job : Construction de l'image Docker et vérification du démarrage
  # Ne se lance QUE si le job 'test' s'est terminé avec succès grâce à 'needs'
  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      # Étape 1 : Récupérer le code source
      - name: Checkout repository
        uses: actions/checkout@v4

      # Étape 2 : Construire l'image Docker de l'API en injectant le SHA du commit comme build-arg
      - name: Build Docker image
        run: |
          docker build --build-arg COMMIT_HASH=${{ github.sha }} -t film-classifier-api .

      # Étape 3 : Démarrer le conteneur en arrière-plan pour vérifier qu'il tourne
      - name: Run Docker container
        run: |
          docker run -d -p 8000:8000 --name mon-api-container film-classifier-api
          # Petite pause pour laisser le temps à l'application de démarrer et charger le modèle
          sleep 5

      # Étape 4 : Vérifier que l'API répond correctement (test de santé basique sur la documentation)
      - name: Test container health
        run: |
          curl --fail http://localhost:8000/docs || exit 1

  # 3. Troisième job : Connexion au registre Azure et publication de l'image
  # Ne se lance QUE si le job 'image' s'est terminé avec succès
  publier:
    needs: image
    runs-on: ubuntu-latest
    steps:
      # Étape 1 : Récupérer le code source
      - name: Checkout repository
        uses: actions/checkout@v4

      # Étape 2 : Se connecter à Azure Container Registry (ACR) via les secrets GitHub
      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # Étape 3 : Construire, injecter le SHA du commit, étiqueter et pousser l'image sur ACR
      - name: Build, tag, and push image to ACR
        run: |
          # Définition du tag de l'image avec l'adresse du registre et l'identifiant du commit
          IMAGE_TAG="${{ secrets.ACR_REGISTRY }}/film-classifier:${{ github.sha }}"
          
          # Construction de l'image avec le tag spécifique et transmission du COMMIT_HASH
          docker build --build-arg COMMIT_HASH=${{ github.sha }} -t $IMAGE_TAG .
          
          # Envoi de l'image sur le registre Azure
          docker push $IMAGE_TAG